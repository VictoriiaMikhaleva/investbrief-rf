name: Analytics CI

on:
  push:
    branches: [main, master]
    paths:
      - 'analytics-core.js'
      - 'analytics.js'
      - 'functions/lib/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/analytics.yml'
  pull_request:
    paths:
      - 'analytics-core.js'
      - 'analytics.js'
      - 'functions/lib/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/analytics.yml'
  schedule:
    - cron: '0 6 * * 1-5'

jobs:
  test-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync analytics core
        run: node scripts/sync-analytics-core.mjs
      - name: Run MOEX analytics tests
        run: node scripts/test-analytics.mjs
      - name: Run server analytics layer tests
        run: node scripts/test-analytics-server.mjs
