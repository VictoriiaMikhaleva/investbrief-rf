name: Update Dividend Patches

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh dividend patches
        run: npm run update:dividends

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/dividend-patches.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dividend-patches.json
            git commit -m "chore(data): refresh dividend patches"
            git push
          else
            echo "No dividend patch changes"
          fi
